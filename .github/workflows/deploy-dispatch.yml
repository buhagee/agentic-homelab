name: Deploy Dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to homeserver-deploy
        if: github.ref == 'refs/heads/main' && env.DEPLOY_DISPATCH_TOKEN != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.request('POST /repos/buhagee/homeserver-deploy/dispatches', {
              event_type: 'deploy',
              client_payload: {
                app: 'agentic-homelab',
                sha: context.sha
              }
            })
