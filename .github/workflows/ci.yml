name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run all tests
        run: bash scripts/testing/run-all.sh

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Compose configuration
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          docker compose -f docker-compose.platform.yml \
            --profile '*' \
            --env-file versions.env --env-file .env.ci \
            --project-name qacey-platform config --quiet
      - name: Validate the separate native development gateway
        run: python3 scripts/testing/check-dev-web.py --docker

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image references exist
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          COMPOSE_ENV_FILE=.env.ci bash scripts/testing/check-images.sh

  build-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build changed local images
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          COMPOSE_ENV_FILE=.env.ci bash scripts/testing/build-changed-images.sh \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Renovate configuration
        run: npx --yes --package renovate renovate-config-validator

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Scan for secret patterns
        run: python3 scripts/testing/check_secret_patterns.py .

  automerge-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Evaluate automerge policy
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python3 scripts/testing/check_automerge_policy.py \
            --author "$PR_AUTHOR" \
            --labels "$PR_LABELS" \
            --changed-files "$(git diff --name-only "$merge_base" "$HEAD_SHA")"

  opencode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify native packaging, shared skills, MCP schemas and PTY
        run: python3 scripts/testing/check-dev-runtime.py
      - name: Verify OpenChamber stop and bounded failure restarts in systemd
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/qacey-stop.XXXXXXXX")"
          cat > "$fixture/service.sh" <<'EOF'
          #!/bin/bash
          set -eu
          mode="$1"
          state="$2"
          if [[ "$mode" == record ]]; then
            printf '%s %s %s\n' "$SERVICE_RESULT" "$EXIT_CODE" "$EXIT_STATUS" > "$state.result"
            exit 0
          fi
          trap 'exit 143' TERM
          echo started >> "$state.starts"
          systemd-notify --ready
          case "$mode" in
            stop) while :; do sleep infinity & wait "$!"; done ;;
            error) exit 1 ;;
            kill) kill -KILL "$$" ;;
          esac
          EOF
          # Apply the managed unit's policy to synthetic processes only. Shorten
          # the backoff here; the provisioner test checks the production delay.
          mapfile -t policy < <(sed -nE '/^(SuccessExitStatus|Restart|StartLimitIntervalSec|StartLimitBurst)=/s/^/--property=/p' \
            infrastructure/dev-agent/qacey-openchamber.service.in)
          units=()
          trap 'if ((${#units[@]})); then sudo -n systemctl stop "${units[@]}" 2>/dev/null || true; fi' EXIT
          for mode in stop error kill; do
            unit="qacey-ci-${fixture##*.}-$mode.service"
            units+=("$unit")
            state="$fixture/$mode"
            sudo -n systemd-run --unit="$unit" --uid="$(id -u)" --gid="$(id -g)" \
              --property=Type=notify --property=NotifyAccess=all \
              --property=RestartSec=100ms --property=TimeoutStartSec=10s --property=TimeoutStopSec=5s \
              --property="ExecStopPost=/bin/bash \"$fixture/service.sh\" record \"$state\"" \
              "${policy[@]}" /bin/bash "$fixture/service.sh" "$mode" "$state"
            if [[ "$mode" == stop ]]; then
              sudo -n systemctl stop "$unit"
              sleep .3 # Longer than the fixture's restart delay.
              result="$(cat "$state.result")"
              if [[ "$result" != 'success exited 143' ]] || systemctl is-active --quiet "$unit" ||
                 [[ "$(wc -l < "$state.starts")" != 1 ]]; then
                echo "Expected one start and a clean stop (numeric 143); got: $result"
                exit 1
              fi
              echo "Clean systemd stop after one start ($result): PASS"
            else
              # A rate-limited unit can retain the original failure in Result.
              for ((attempt = 0; attempt < 50; attempt++)); do
                active_state="$(systemctl show "$unit" -p ActiveState --value)"
                [[ "$active_state" != failed ]] || break
                sleep .2
              done
              starts="$(wc -l < "$state.starts")"
              result="$(systemctl show "$unit" -p Result --value)"
              if [[ "$active_state" != failed || "$starts" != 3 ]]; then
                echo "Expected $mode to fail after three starts; got: $active_state/$result ($starts starts)"
                exit 1
              fi
              echo "Systemd $mode stopped retrying after $starts starts ($result): PASS"
            fi
          done
