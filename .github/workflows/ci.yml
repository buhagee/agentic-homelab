name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run all tests
        run: bash scripts/testing/run-all.sh

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Compose configuration
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          docker compose -f docker-compose.platform.yml \
            --profile '*' \
            --env-file versions.env --env-file .env.ci \
            --project-name qacey-platform config --quiet
      - name: Validate the separate native development gateway
        run: python3 scripts/testing/check-dev-web.py --docker

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image references exist
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          COMPOSE_ENV_FILE=.env.ci bash scripts/testing/check-images.sh

  build-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build changed local images
        run: |
          cp .env.example .env.ci
          sed -i "s|^PLATFORM_DIR=.*|PLATFORM_DIR=$PWD|" .env.ci
          COMPOSE_ENV_FILE=.env.ci bash scripts/testing/build-changed-images.sh \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Renovate configuration
        run: npx --yes --package renovate renovate-config-validator

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Scan for secret patterns
        run: python3 scripts/testing/check_secret_patterns.py .

  automerge-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Evaluate automerge policy
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python3 scripts/testing/check_automerge_policy.py \
            --author "$PR_AUTHOR" \
            --labels "$PR_LABELS" \
            --changed-files "$(git diff --name-only "$merge_base" "$HEAD_SHA")"

  opencode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify native packaging, shared skills, MCP schemas and PTY
        run: python3 scripts/testing/check-dev-runtime.py
      - name: Build the pinned OpenCode image
        run: |
          set -a; . ./versions.env; set +a
          docker build \
            --build-arg OPENCODE_V2_VERSION="${OPENCODE_V2_VERSION}" \
            --build-arg OPENCODE_V2_NODE_VERSION="${OPENCODE_V2_NODE_VERSION}" \
            --build-arg OPENCODE_V2_PNPM_VERSION="${OPENCODE_V2_PNPM_VERSION}" \
            -t opencode-smoke services/opencode
      - name: Check the binary and CLI load
        run: |
          set -a; . ./versions.env; set +a
          version="$(docker run --rm -e HOME=/tmp opencode-smoke opencode --version)"
          echo "reported: ${version}"
          case "${version}" in
            *"${OPENCODE_V2_VERSION}"*) ;;
            *) echo "version mismatch: expected ${OPENCODE_V2_VERSION}" >&2; exit 1 ;;
          esac
          docker run --rm -e HOME=/tmp opencode-smoke opencode --help >/dev/null
