# CrowdSec log acquisition — Oracle VPS
#
# Reads Traefik access logs from a shared log file volume.
# oracle-traefik writes access logs to /var/log/traefik/access.log.
# crowdsec-oracle reads the same file via a shared volume mount.
# This avoids the Docker stdout acquisition mixing access log JSON with
# plugin log lines (which caused JSON parse errors and broke AppSec).
filenames:
  - /var/log/traefik/access.log
labels:
  type: traefik

---
# SSH brute-force detection via systemd journal
# Requires crowdsecurity/sshd collection (installed by server-setup-oracle.sh)
source: journald
journalctl_filter:
  - "_SYSTEMD_UNIT=ssh.service"
labels:
  type: syslog

---
# U-12: AppSec WAF listener
# CrowdSec AppSec component — inspects HTTP requests forwarded by the Traefik plugin.
# Listens on 0.0.0.0:7422 (must be 0.0.0.0 inside Docker, not 127.0.0.1).
source: appsec
listen_addr: 0.0.0.0:7422
appsec_config: crowdsecurity/appsec-default
labels:
  type: appsec
