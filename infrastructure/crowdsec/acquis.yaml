# CrowdSec log acquisition — Traefik access log
# Mounted read-only from the shared traefik logs volume.
filenames:
  - /var/log/traefik/access.log
labels:
  type: traefik

---
# U-12: AppSec WAF listener
# CrowdSec AppSec component — inspects HTTP requests forwarded by the Traefik plugin.
# Listens on 0.0.0.0:7422 (must be 0.0.0.0 inside Docker, not 127.0.0.1).
# Traefik plugin forwards each request here before passing it to the backend.
source: appsec
listen_addr: 0.0.0.0:7422
appsec_config: crowdsecurity/appsec-default
labels:
  type: appsec
