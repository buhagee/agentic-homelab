# Oracle Traefik v3 — Static Configuration
# TLS termination for all *.example.com traffic.
# Forwards to home server via WireGuard tunnel (10.100.0.2).
#
# Routing architecture:
#   Client → oracle-traefik (443, Let's Encrypt DNS-01 wildcard cert)
#          → WireGuard tunnel → home Traefik (10.100.0.2:443)
#          → service containers
#
# DNS setup in Cloudflare (DNS-only, orange cloud OFF):
#   A   *.example.com    → 203.0.113.10  (wildcard, grey cloud)
#   A   status.example.com → 203.0.113.10  (already set)
#
# Changes to this file require oracle-traefik container restart.

log:
  level: "WARN"

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - secure-headers@file
        - global-ratelimit@file
    transport:
      respondingTimeouts:
        readTimeout: 0        # No timeout for reading request body (large uploads)
        writeTimeout: 0       # No timeout for writing response
        idleTimeout: 3600s    # 1 hour idle timeout for long uploads
      lifeCycle:
        requestAcceptGraceTimeout: 0
        graceTimeOut: 30s

providers:
  file:
    directory: "/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # Email set via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var
      storage: "/acme.json"
      # DNS-01 challenge via Cloudflare — issues a single wildcard cert for *.example.com.
      # Requires CF_DNS_API_TOKEN env var (Zone → DNS → Edit permission).
      # No port 80 exposure needed for challenge verification.
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
