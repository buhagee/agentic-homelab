ping: {}

log:
  level: "WARN"

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100

entryPoints:
  traefik:
    address: ":8081"
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - global-ratelimit@file
    transport:
      respondingTimeouts:
        readTimeout: 0        # No timeout for reading request body (large uploads)
        writeTimeout: 0       # No timeout for writing response
        idleTimeout: 3600s    # 1 hour idle timeout for long uploads
      lifeCycle:
        requestAcceptGraceTimeout: 0
        graceTimeOut: 30s
  cloudflared:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: qacey-proxy
  file:
    directory: "/dynamic"
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      storage: "/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
        propagation:
          delayBeforeChecks: "30s"
  letsencrypt:
    acme:
      storage: "/acme.json"
      dnsChallenge:
        provider: desec
        resolvers: ["ns1.desec.io:53", "ns2.desec.org:53"]
        propagation:
          delayBeforeChecks: "120s"
          disableAnsChecks: true

api:
  dashboard: false
  insecure: false
