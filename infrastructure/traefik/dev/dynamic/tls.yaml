# infrastructure/traefik/dev/dynamic/tls.yaml
# Tells Traefik to use the mkcert cert for *.qacey.local

tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key
