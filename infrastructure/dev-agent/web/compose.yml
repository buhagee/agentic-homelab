# Installed separately; never include this in docker-compose.platform.yml.
name: qacey-dev-web
services:
  oauth:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION:?required}
    user: "65532:65532"
    command: ["--config=/etc/oauth2-proxy/config.cfg"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    env_file:
      - path: ./oauth2.env
        required: true
        format: raw
    volumes:
      - type: bind
        source: ./oauth2-proxy.cfg
        target: /etc/oauth2-proxy/config.cfg
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./allowed-emails.txt
        target: /etc/oauth2-proxy/allowed-emails.txt
        read_only: true
        bind: {create_host_path: false}
    networks: [qacey-proxy, private]
    depends_on: [adapter]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qacey-proxy"
      - "traefik.http.routers.qacey-dev.rule=Host(`@HOSTNAME@`)"
      - "traefik.http.routers.qacey-dev.entrypoints=websecure"
      - "traefik.http.routers.qacey-dev.tls=true"
      - "traefik.http.routers.qacey-dev.tls.certresolver=@CERT_RESOLVER@"
      - "traefik.http.routers.qacey-dev.service=qacey-dev"
      - "traefik.http.routers.qacey-dev.observability.accesslogs=false"
      - "traefik.http.services.qacey-dev.loadbalancer.server.port=4180"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  adapter:
    image: caddy:${CADDY_VERSION:?required}
    user: "@UID@:@GID@"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    environment:
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev"]
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      # Mount the directory, not its inode, so socket recreation remains visible.
      - type: bind
        source: /run/qacey-dev-proxy
        target: /run/qacey-dev-proxy
        read_only: true
        bind: {create_host_path: false}
    networks: [private]
    labels: {traefik.enable: "false"}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  qacey-proxy:
    name: qacey-proxy
    external: true
  private:
    internal: true
