# Hermes Agent — Git-owned config seed
# Used only when /opt/data/config.yaml is missing. After the first boot, the
# Hermes UI owns config.yaml, including model/provider, mcp_servers, and plugins.
# Deploy never overwrites an existing config.yaml.

# OpenRouter remains the dedicated OpenAI-compatible backend for vision and
# other repo-managed surfaces that still expect an OpenAI-compatible endpoint.
custom_providers:
  - name: openrouter
    base_url: ${HERMES_OPENROUTER_BASE_URL}
    key_env: OPENROUTER_API_KEY
    api_mode: openai

model:
  provider: ${HERMES_PROVIDER}
  model: ${HERMES_MODEL}
  api_mode: openai
  # gpt-5.6-luna supports image input, but the provider alias may not be
  # discoverable through models.dev. Keep native image parts from being
  # downgraded to text descriptions.
  supports_vision: true

fallback_model:
  provider: ${HERMES_FALLBACK_PROVIDER}
  model: ${HERMES_MODEL_FALLBACK}
  base_url: ${HERMES_FALLBACK_BASE_URL}
  key_env: ${HERMES_FALLBACK_KEY_ENV}

gateway:
  image_input_mode: ${HERMES_IMAGE_INPUT_MODE}

# Hermes image generation through OpenRouter. This is separate from chat
# vision: the selected model must advertise image output, not merely image
# input. OpenRouter uses the same OPENROUTER_API_KEY already supplied for chat.
image_gen:
  provider: openrouter
  model: ${HERMES_IMAGE_GEN_MODEL}
  max_parallel_requests: ${HERMES_IMAGE_GEN_MAX_PARALLEL_REQUESTS}

auxiliary:
  vision:
    provider: openrouter
    model: ${HERMES_VISION_MODEL}
    base_url: ${HERMES_OPENROUTER_BASE_URL}
    timeout: 120

terminal:
  backend: ${HERMES_TERMINAL_BACKEND}
  docker_image: ${HERMES_TERMINAL_IMAGE}

agent:
  max_turns: 200
  # Highest Hermes thinking level. GPT-5.6 is normalized to the provider's
  # supported "max" value by the chat-completions transport.
  reasoning_effort: ${HERMES_REASONING_EFFORT}
  # The gateway delegates this decision to agent.image_input_mode. Native mode
  # keeps pixels on the user turn for vision-capable models.
  image_input_mode: ${HERMES_IMAGE_INPUT_MODE}

compression:
  enabled: true

privacy:
  # Reduce direct identifier leakage to model providers. This does not remove
  # all sensitive personal data; keep sensitive discussions out of cloud turns.
  redact_pii: true

security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_timeout: 5
  # Fail closed when command scanning is unavailable or errors.
  tirith_fail_open: false

# Keep canonical SQLite store, prune ended sessions after 400 days (one year
# plus buffer), and do not create redundant full JSON transcript snapshots.
# File permissions are enforced by deploy script.
sessions:
  auto_prune: true
  retention_days: 400
  vacuum_after_prune: true
  min_interval_hours: 24
  write_json_snapshots: false

memory:
  memory_enabled: true
  user_profile_enabled: true

# Long-running no-agent cron scripts need more than the default 120s timeout.
cron:
  script_timeout_seconds: 600

approvals:
  mode: smart
  mcp_reload_confirm: false
